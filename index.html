<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MindTally</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght,GRAD@0,17..18,400..700,-50..200;1,17..18,400..700,-50..200&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="container-jar">
      <div>
        <h1>MindTally</h1>
        <h2 id="count-el">0</h2>
        <div class="container-btn">
          <div class="add_minbtn">
            <button class="btn-action1 btn-action">Increment +</button>
            <button class="btn-action2 btn-action">Decrement -</button>
          </div>
          <div class="step-wrapper">
            <label for="step-input">Count by:</label>
            <input
              type="number"
              id="step-input"
              class="step-input"
              min="1"
              value="1"
              placeholder="1"
            />
          </div>
          <div class="entries-meta">
            <span class="entry-count">0 Saves</span>
            <span class="session-total">Total: 0</span>
          </div>
          <button class="btn-action3 btn-action">Save</button>
        </div>

        <div id="save-el" class="text"></div>

        <button class="btn-action4 btn-action">Reset</button>
      </div>
    </div>
  </body>
</html>
